# Validate the config that bot PRs propose.
#
# peter-evans/create-pull-request opens the chore/buildroot-mirror and
# import/rawhide-<pkg> PRs with the workflow's own GITHUB_TOKEN, and GitHub
# deliberately does not run pull_request workflows for events it caused: a
# GITHUB_TOKEN-opened PR starts no checks, so validate.yml never exercises
# the new pin, lock, recipes, or imports before a maintainer approves the
# PR. The first three weekly refreshes after that landed had no checks at
# all (issue #377, runs reported as "0 checks").
#
# The same gap closed for the daily bump already, but on a different seam:
# bump-upstream-gate.yml is workflow_dispatch'd from the bump workflow and
# itself calls the rebuild. Its check suite appears on the PR because the
# dispatched run is workflow_dispatch from this repository's own GITHUB_TOKEN
# (the same token the bot workflow used), so GitHub attaches it to the
# dispatching PR head SHA. buildroot and import use this workflow for the
# same reason: dispatch from the bot workflow's last step, the workflow
# checks out the PR's head SHA, and the check suite attaches to the PR.
#
# workflow_run was tried first (#378 instead) and found unable to attach
# checks to GITHUB_TOKEN-opened bot PRs: pull_requests[] is empty for
# schedule/workflow_dispatch triggers, so the job's if-gate never fires.
# workflow_dispatch does not have that limitation: a dispatch from the
# bot workflow runs in this repository's context with refs/pr (not workflow_run)
# and its check suite attaches to the PR head SHA opened by the bot.

name: Validate bot pull requests

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number the dispatching bot workflow just opened."
        required: true
        type: string

jobs:
  validate:
    # Resolve the PR's head SHA and branch once, then check out the same
    # commit the PR's checks need to attach to. The dispatcher passes only the
    # PR number; everything else is on the API.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # write is scoped here, not at the workflow level, because only the
      # gh pr comment step on failure needs it; the validation runs are
      # read-only.
      pull-requests: write
    steps:
      - name: Resolve the PR head SHA and branch from the PR number
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head="$(gh pr view "$PR" -R "$REPOSITORY" --json headRefName,headRefOid \
              --jq '.headRefOid + " " + .headRefName')"
          echo "head=$head"
          SHA="${head%% *}"
          BRANCH="${head#* }"
          test -n "$SHA"
          test -n "$BRANCH"
          {
            echo "sha=$SHA"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 1
      - name: Validate factory configuration
        run: |
          # gate
          python3 tools/validate.py
      - name: Validate the factory onboarding contract
        run: |
          # gate
          python3 tools/factory_contract.py
      - name: Workflow build-script quoting
        run: |
          # gate
          python3 tools/check_workflow_quoting.py
      - name: Runtime contract
        run: |
          # gate
          python3 tools/runtime_contract.py \
            config/bluefin-packages.toml config/runtime-contract.toml --check
      - name: Install test dependencies
        run: |
          pip install --disable-pip-version-check pytest==8.3.5 pyyaml==6.0.3
      - name: Unit tests
        run: |
          # gate
          python3 -m pytest tests -q
      - name: Comment on the pull request with the validation outcome
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" -R "$REPOSITORY" --body "\
            ### Validation failed for the bot pull request

            The bot pull request failed one of the validation
            steps in \`bot-pr-validate.yml\`. Inspect the [workflow run
            log]($RUN_URL) and fix the cause before merging.

            The PR is still mergeable; this comment is informational. A
            maintainer should rerun this workflow once the cause is fixed."