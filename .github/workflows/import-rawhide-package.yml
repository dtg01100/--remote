name: Import Rawhide package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Fedora dist-git package name to import
        required: true
        type: string
      branch:
        description: Upstream branch
        required: true
        default: rawhide
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Import Fedora dist-git snapshot
        env:
          PACKAGE: ${{ inputs.package }}
          BRANCH: ${{ inputs.branch }}
        run: |
          python3 tools/import_rawhide.py \
            "$PACKAGE" \
            --branch "$BRANCH"
      - name: Open reviewable update
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: import/rawhide-${{ inputs.package }}
          delete-branch: true
          title: 'import: Rawhide ${{ inputs.package }}'
          commit-message: 'import: Rawhide ${{ inputs.package }}'
          body: |
            Imports Fedora dist-git at the exact commit recorded in
            `packages/${{ inputs.package }}/.hummingbird-upstream.json`.
            Review and patch the snapshot here before enabling it in a rebuild set.
      - name: Dispatch bot-pr-validate on the PR head (#378)
        # workflow_run cannot attach checks to GITHUB_TOKEN-opened bot PRs
        # because pull_requests[] is empty for schedule/workflow_dispatch
        # triggers. Dispatch bot-pr-validate explicitly so its check suite
        # attaches to the PR head (#377).
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run bot-pr-validate.yml -R "$REPOSITORY" \
            --ref import/rawhide-${{ inputs.package }} -f pr="$PR"
          echo "dispatched bot-pr-validate for PR #$PR"
